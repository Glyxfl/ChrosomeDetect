name: Workbench validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy Pillow torch opencv-python PyYAML
      - run: python -m unittest discover -s workbench/tests -v
      - run: python -m workbench.tests.http_smoke
      - run: node --check workbench/web/app.js
      - run: node --check workbench/web/slides.js
